server {
    listen 80;
    server_name qapple.quentindurant.com;

    root /chemin/vers/votre/site;  # Remplacez par le chemin réel sur le serveur
    index index.html Index.html;   # Accepte les deux variantes du nom de fichier

    location / {
        try_files $uri $uri/ =404;
        autoindex off;
        
        # Autoriser explicitement l'accès
        allow all;
    }

    # Désactiver l'accès aux fichiers cachés
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
