name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            # Créer le répertoire si nécessaire
            mkdir -p ${{ secrets.PROJECT_PATH }}
            
            # Aller dans le répertoire du projet
            cd ${{ secrets.PROJECT_PATH }}
            
            # Supprimer le contenu existant
            rm -rf *
            
            # Cloner le dépôt
            git clone https://github.com/${{ github.repository }}.git .
            
            # Définir les permissions
            chmod -R 755 .
            find . -type f -exec chmod 644 {} \;
            
            # Créer un fichier index.html en minuscules (important pour certains serveurs web)
            if [ -f "Index.html" ] && [ ! -f "index.html" ]; then
              cp Index.html index.html
            fi
            
            # Vérifier la configuration Nginx existante
            echo "Vérification des configurations Nginx existantes..."
            sudo find /etc/nginx/ -type f -name "*.conf" -exec grep -l "qapple.quentindurant.com" {} \; || true
            
            # Lister les sites activés
            echo "Sites Nginx activés:"
            ls -la /etc/nginx/sites-enabled/ || true
            
            # Vérifier les configurations de serveur dans nginx.conf
            echo "Contenu de nginx.conf:"
            cat /etc/nginx/nginx.conf || true
            
            # Vérifier si une configuration existe pour le domaine
            NGINX_CONF_FILE=$(sudo find /etc/nginx/ -type f -name "*.conf" -exec grep -l "qapple.quentindurant.com" {} \; | head -n 1)
            
            if [ -n "$NGINX_CONF_FILE" ]; then
              echo "Configuration trouvée dans $NGINX_CONF_FILE:"
              cat "$NGINX_CONF_FILE"
              
              # Modifier la configuration existante
              echo "Mise à jour de la configuration existante..."
              sudo sed -i "s|root .*;|root ${{ secrets.PROJECT_PATH }};|" "$NGINX_CONF_FILE"
              sudo sed -i "s|index .*;|index index.html Index.html;|" "$NGINX_CONF_FILE"
            else
              echo "Aucune configuration trouvée pour qapple.quentindurant.com, création d'une nouvelle..."
              
              # Créer un fichier de configuration temporaire
              cat > /tmp/qapple.conf << EOL
server {
    listen 80;
    server_name qapple.quentindurant.com;
    root ${{ secrets.PROJECT_PATH }};
    index index.html Index.html;
    
    location / {
        try_files \$uri \$uri/ =404;
    }
}
EOL
              
              # Copier la configuration
              sudo cp /tmp/qapple.conf /etc/nginx/conf.d/qapple.quentindurant.com.conf
            fi
            
            # Tester et recharger Nginx
            echo "Test de la configuration Nginx..."
            sudo nginx -t
            
            if [ $? -eq 0 ]; then
              echo "Configuration Nginx valide, rechargement..."
              sudo systemctl reload nginx
            else
              echo "Erreur dans la configuration Nginx, vérifiez les logs."
            fi
            
            # Vérifier les logs d'erreur
            echo "Dernières erreurs du serveur Nginx:"
            sudo tail -n 20 /var/log/nginx/error.log || true
            
            # Vérifier les permissions du répertoire
            echo "Permissions du répertoire du projet:"
            ls -la ${{ secrets.PROJECT_PATH }}
            
            # Vérifier si le site est accessible localement
            echo "Test d'accès local au site:"
            curl -I http://localhost/index.html || true