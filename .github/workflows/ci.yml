name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            # Créer le répertoire si nécessaire
            mkdir -p ${{ secrets.PROJECT_PATH }}
            
            # Aller dans le répertoire du projet
            cd ${{ secrets.PROJECT_PATH }}
            
            # Supprimer le contenu existant
            rm -rf *
            
            # Cloner le dépôt
            git clone https://github.com/${{ github.repository }}.git .
            
            # Définir les permissions
            chmod -R 755 .
            find . -type f -exec chmod 644 {} \;
            
            # Créer un fichier index.html en minuscules
            if [ -f "Index.html" ] && [ ! -f "index.html" ]; then
              cp Index.html index.html
            fi
            
            # Créer une configuration Nginx simple
            echo "Création d'une configuration Nginx simple..."
            sudo tee /etc/nginx/conf.d/qapple.quentindurant.com.conf > /dev/null << 'EOF'
            server {
                listen 80;
                server_name qapple.quentindurant.com;
                root ${{ secrets.PROJECT_PATH }};
                index index.html Index.html;
                
                location / {
                    try_files $uri $uri/ =404;
                }
            }
            EOF
            
            # Tester et recharger Nginx
            echo "Test de la configuration Nginx..."
            sudo nginx -t && sudo systemctl reload nginx
            
            # Afficher les permissions du répertoire
            ls -la