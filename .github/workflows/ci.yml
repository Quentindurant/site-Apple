name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            # Créer le répertoire si nécessaire
            mkdir -p ${{ secrets.PROJECT_PATH }}
            
            # Aller dans le répertoire du projet
            cd ${{ secrets.PROJECT_PATH }}
            
            # Supprimer le contenu existant
            rm -rf *
            
            # Cloner le dépôt
            git clone https://github.com/${{ github.repository }}.git .
            
            # Définir les permissions
            chmod -R 755 .
            find . -type f -exec chmod 644 {} \;
            
            # Créer un fichier index.html en minuscules
            if [ -f "Index.html" ] && [ ! -f "index.html" ]; then
              cp Index.html index.html
            fi
            
            # Diagnostiquer la configuration Nginx existante
            echo "Vérification de la configuration Nginx..."
            sudo find /etc/nginx/ -type f -name "*.conf" -exec grep -l "listen" {} \; | xargs cat 2>/dev/null | grep -E "listen\s+[0-9]+" || echo "Aucun port trouvé"
            
            # Déterminer le port utilisé par Nginx
            NGINX_PORT=$(sudo netstat -tlnp | grep nginx | grep -oE ':[0-9]+' | cut -d':' -f2 | head -n1 || echo "8080")
            echo "Port Nginx détecté: $NGINX_PORT"
            
            # Créer une configuration Nginx adaptée
            echo "Création d'une configuration Nginx..."
            sudo tee /etc/nginx/conf.d/qapple.quentindurant.com.conf > /dev/null << EOF
            server {
                listen $NGINX_PORT;
                server_name qapple.quentindurant.com;
                root ${{ secrets.PROJECT_PATH }};
                index index.html Index.html;
                
                location / {
                    try_files \$uri \$uri/ =404;
                }
                
                # Logs spécifiques pour ce site
                access_log /var/log/nginx/qapple.access.log;
                error_log /var/log/nginx/qapple.error.log;
            }
            EOF
            
            # Tester et recharger Nginx
            echo "Test de la configuration Nginx..."
            sudo nginx -t && sudo systemctl reload nginx
            
            # Vérifier les logs d'erreur spécifiques
            echo "Vérification des logs d'erreur..."
            sudo tail -n 20 /var/log/nginx/error.log || true
            sudo tail -n 20 /var/log/nginx/qapple.error.log 2>/dev/null || true
            
            # Vérifier si le site est accessible localement
            echo "Test d'accès local au site..."
            curl -I http://localhost:$NGINX_PORT/index.html || true
            
            # Vérifier les permissions
            echo "Permissions du répertoire:"
            ls -la ${{ secrets.PROJECT_PATH }}
            
            # Vérifier la résolution DNS
            echo "Test de résolution DNS:"
            host qapple.quentindurant.com || nslookup qapple.quentindurant.com || true