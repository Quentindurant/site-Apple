name: CI

on: [push]

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Push to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            # Vérifier si le répertoire existe
            if [ ! -d "${{ secrets.PROJECT_PATH }}" ]; then
              echo "Le répertoire n'existe pas, création et clonage du dépôt"
              mkdir -p "${{ secrets.PROJECT_PATH }}"
              cd "${{ secrets.PROJECT_PATH }}"
              git clone https://github.com/${{ github.repository }}.git .
            else
              cd "${{ secrets.PROJECT_PATH }}"
              # Vérifier si c'est un dépôt Git valide
              if [ ! -d ".git" ]; then
                echo "Le répertoire n'est pas un dépôt Git valide, initialisation"
                rm -rf * .[^.]*
                git clone https://github.com/${{ github.repository }}.git .
              else
                echo "Mise à jour du dépôt existant"
                sudo git config --global --add safe.directory "${{ secrets.PROJECT_PATH }}"
                sudo git fetch --all
                sudo git reset --hard origin/main
              fi
            fi
            
            # Corriger les permissions des fichiers
            echo "Correction des permissions des fichiers"
            sudo find "${{ secrets.PROJECT_PATH }}" -type f -exec chmod 644 {} \;
            sudo find "${{ secrets.PROJECT_PATH }}" -type d -exec chmod 755 {} \;
            sudo chown -R www-data:www-data "${{ secrets.PROJECT_PATH }}"
            
            # Créer un fichier index.html simple à la racine du site
            echo "Création d'un fichier index.html simple"
            sudo tee "${{ secrets.PROJECT_PATH }}/index.html" > /dev/null << 'EOL'
            <!DOCTYPE html>
            <html lang="fr">
            <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <title>Redirection</title>
                <meta http-equiv="refresh" content="0;url=Index.html">
            </head>
            <body>
                <p>Redirection en cours...</p>
                <script>window.location.href = "Index.html";</script>
            </body>
            </html>
            EOL